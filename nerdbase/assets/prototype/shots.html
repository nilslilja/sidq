<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>shots</title><link rel="stylesheet" href="screens.css">
<style>
html,body{margin:0;background:#fff}
.f{position:relative;width:1290px;height:2796px;overflow:hidden;font-family:Inter,sans-serif}
.head{position:absolute;left:96px;right:96px;top:130px}
.f h1{font-size:124px;line-height:1.03;letter-spacing:-4.5px;font-weight:800;color:#14110F}
.f h1 em{font-style:normal;color:#FB6415}
.f .sub{margin-top:34px;font-size:52px;line-height:1.25;font-weight:600;color:#6F6A64}
.dev{position:absolute;left:112px;top:640px;width:1066px;height:2300px;border-radius:150px;background:#14110F;padding:24px;box-shadow:0 60px 140px rgba(120,40,0,.35)}
.scr{width:1018px;height:2252px;border-radius:128px;overflow:hidden;position:relative}
.scr .ph{transform:scale(2.3674);transform-origin:0 0}
.scr .ph{width:430px;height:932px}
</style></head><body>
<div id="o"></div>
<script src="screens.js"></script>
<script>
const q=new URLSearchParams(location.search);const n=+q.get('n')||1;
const D=[
 {h:'Skanna läxan. <em>Förstå den direkt.</em>',p:'Appen guidar dig medan du skannar.',bg:'linear-gradient(170deg,#FFE3D0 0%,#FFF3EA 55%,#FBF8F4 100%)',s:()=>NB_SCREENS.scan('hold')},
 {h:'Varje steg <em>förklarat.</em>',p:'Från uppgift till lösning, med vanliga misstag markerade.',bg:'linear-gradient(170deg,#FFF1CC 0%,#FFF8E6 55%,#FBF8F4 100%)',s:()=>NB_SCREENS.result()},
 {h:'Matte som du <em>faktiskt vill</em> göra.',p:'Korta lektioner, tydliga nivåer och en streak som håller dig igång.',bg:'linear-gradient(170deg,#E4F0FF 0%,#F2F7FF 55%,#FBF8F4 100%)',s:()=>NB_SCREENS.path()},
 {h:'Lär dig av <em>varje misstag.</em>',p:'Högskoleprovet, steg för steg, med knepen som sparar tid.',bg:'linear-gradient(170deg,#FFE0E2 0%,#FFF1F2 55%,#FBF8F4 100%)',s:()=>NB_SCREENS.lessonKVA('bad')},
 {h:'25&nbsp;min fokus. <em>7&nbsp;min&nbsp;paus.</em>',p:'Bygg rutinen som gör att det faktiskt fastnar.',bg:'linear-gradient(170deg,#DDF5E8 0%,#EFFAF4 55%,#FBF8F4 100%)',s:()=>NB_SCREENS.timer()},
];
const d=D[n-1];
document.getElementById('o').innerHTML=`<div class="f" id="frame" style="background:${d.bg}"><div class="head"><h1>${d.h}</h1><div class="sub">${d.p}</div></div><div class="dev"><div class="scr"><div class="ph">${d.s()}</div></div></div></div>`;
</script></body></html>
