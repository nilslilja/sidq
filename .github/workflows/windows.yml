# ─────────────────────────────────────────────────────────────────────────────
# Build Sidq for Windows.
#
# ── Why this exists rather than a line in release.sh ─────────────────────────
#
# A Tauri app for Windows cannot be cross-compiled from a Mac. It needs the MSVC
# toolchain and links against WebView2, neither of which exists on macOS, so
# "add Windows to the release script" is not a thing that can work. The code has
# compiled for Windows for a while and no Windows binary has ever existed, which
# is why the site correctly offers Mac only.
#
# So it builds on an actual Windows machine that GitHub rents by the minute.
#
# ── What it produces ────────────────────────────────────────────────────────
#
# An .msi and an .exe installer, uploaded as artifacts. Nothing is published to
# the site automatically: the download button is wired to a file the web build
# refuses to ship without, so a Windows link goes up only once somebody has
# downloaded one of these and confirmed it actually runs.
#
# ── Secrets it needs ────────────────────────────────────────────────────────
#
# The same three the Mac build reads from .env, as repository secrets:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, SIDQ_WEB_ORIGIN
# Without them the app builds and sign-in, the plan check and the plans page all
# refuse with "no web address is configured" — see build.rs.
# ─────────────────────────────────────────────────────────────────────────────

name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Cargo output is the slow part and it is identical between runs that did
      # not touch the crate.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # build.rs lifts these out of .env, which is not in the repository. Written
      # here so the compiled binary carries the same values the Mac build does.
      - name: Write .env
        shell: bash
        run: |
          {
            echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}"
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}"
            echo "SIDQ_WEB_ORIGIN=${{ secrets.SIDQ_WEB_ORIGIN }}"
          } > .env

      # Same reasoning as release.sh: the sidecar is built first because a
      # missing one fails the bundle with a path error that explains nothing,
      # and --no-default-features drops Tauri from a binary that never used it.
      - name: Build the MCP sidecar
        shell: bash
        working-directory: src-tauri
        run: |
          cargo build --release --no-default-features --bin sidq-mcp
          mkdir -p binaries
          cp target/release/sidq-mcp.exe binaries/sidq-mcp-x86_64-pc-windows-msvc.exe

      # externalBin is an overlay here for the same reason it is on macOS: the
      # committed tauri.conf.json cannot name a file that this build produces.
      - name: Build the app
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"externalBin":["binaries/sidq-mcp"]}}'

      - name: Check the app and the sidecar both exist
        shell: bash
        run: |
          # The bundle bug that shipped an app with no main binary in it was
          # silent on macOS and would be silent here too. Assert rather than hope.
          #
          # The sidecar is checked in binaries/ rather than target/release/,
          # because it is built with --no-default-features and the app is not:
          # the differing feature set makes cargo clean the earlier artifact,
          # so target/release/sidq-mcp.exe is gone by the time the app is built.
          # The copy in binaries/ is the one Tauri actually bundles anyway.
          ls -la src-tauri/target/release/sidq.exe
          ls -la src-tauri/binaries/sidq-mcp-x86_64-pc-windows-msvc.exe
          echo "── installers produced ──"
          ls -la src-tauri/target/release/bundle/msi/ src-tauri/target/release/bundle/nsis/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: sidq-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
