[package]
name = "sidq"
version = "0.9.4"
description = "One clear day, every morning."
edition = "2021"
# 1.82 for `Option::is_none_or`, which the transcript readers already used
# before this line said so. The manifest claimed 1.77 while the code would not
# build on it, which is the wrong way round for a number whose only job is to
# tell somebody whether their toolchain is new enough.
rust-version = "1.82"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── Two binaries, both named explicitly ──────────────────────────────────────
#
# `sidq-mcp` under src/bin would be auto-discovered, and auto-discovery is what
# broke the bundle: with two binaries and nothing saying which is the app, the
# Tauri bundler picked sidq-mcp. The result had CFBundleExecutable = sidq-mcp,
# no main binary and no frontend in it, and it built and signed without a single
# warning. tauri.conf.json now sets mainBinaryName as well; this half makes the
# ordering explicit rather than incidental.
[[bin]]
name = "sidq"
path = "src/main.rs"

[[bin]]
name = "sidq-mcp"
path = "src/bin/sidq-mcp.rs"

[dependencies]
# NOT "devtools". That feature ships the WebKit inspector in release builds and
# took the binary from 7MB to 66MB, which both blew past storage limits and
# destroyed the size advantage over Electron that is a real selling point.
# Debug builds get devtools automatically without it.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled so there is no system SQLite to depend on and no version to match.
# Cursor, Windsurf and the VS Code forks all keep their chat history in SQLite.
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }

# Reading assistant windows through macOS Accessibility, which is what makes
# Sidq work with no extension, no store and no sign-in. Thin bindings over
# ApplicationServices rather than hand-rolled FFI: CoreFoundation ownership
# rules are exactly the kind of thing to get wrong once and never notice.
[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.1"
core-foundation = "0.10"
# Setting the window level and collection behaviour directly. Tauri's
# always-on-top is NSFloatingWindowLevel, which is below the menu bar and is
# excluded from fullscreen Spaces, and neither is reachable through its API.
objc = "0.2"
# Watching for a click in another application, which is the only signal that the
# picker should close: a non-activating panel takes the keyboard without
# deactivating the app underneath, so clicking back into that app produces no
# focus change for anything to listen to. Blocks are needed for the monitor's
# handler, and objc 0.2's Encode trait cannot describe one.
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSEvent", "NSPasteboard", "NSPasteboardItem"] }

[profile.release]
# A menu-bar companion has no business being 30MB. These four settings take the
# binary to roughly 5MB, which matters because people judge an overlay by whether
# it feels heavy.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
