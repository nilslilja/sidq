<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sidq. The models remember everything except you.</title>
    <meta
      name="description"
      content="Stop introducing yourself to robots. Sidq is the memory layer for every AI you use: every conversation you have ever had, together on your Mac, and any of them carried whole into any other. Word for word, never a summary."
    />
    <meta name="theme-color" content="#F7F6F3" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- No manifest, deliberately: Sidq ships as a signed .dmg, not an installable site. -->

    <!--
      Geist is served from this origin, so there is nothing to preconnect to and
      no third-party stylesheet in the critical path. See src/styles/fonts.css
      for why it stopped coming from Google.

      Only the sans is preloaded. It sets every heading and every line of body
      copy, so it is on screen before anything else is; the mono appears in
      figures and shortcut keys further down and can arrive with the rest.
    -->
    <link
      rel="preload"
      href="/fonts/geist-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      What LinkedIn, Slack and iMessage show when the link is pasted. This is the
      first thing most people will ever see of Sidq.

      The card takes the pitch rather than the headline, and that is deliberate.
      A headline is read on a page that is already explaining itself; a card is
      read alone, in a feed, next to somebody else's message. The line that gets
      repeated goes where repetition happens. The description underneath does
      the explaining the card cannot.
    -->
    <meta property="og:title" content="Stop introducing yourself to robots." />
    <meta
      property="og:description"
      content="Sidq is the memory layer for every AI you use. Every conversation you have ever had, together on your Mac, and any one of them carried whole into any other. Word for word, never a summary."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sidq" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://www.sidq.tech/" />

    <!--
      The image the card actually promises.

      `twitter:card` said summary_large_image and there was no image, so every
      share on LinkedIn and X rendered the wide layout around an empty space,
      which looks worse than the small card would have.
    -->
    <meta property="og:url" content="https://www.sidq.tech/" />
    <meta property="og:image" content="https://www.sidq.tech/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Sidq. The models remember everything except you."
    />
    <meta name="twitter:image" content="https://www.sidq.tech/og.png" />

    <!--
      Structured data, and the reason it is worth the bytes.

      "Sidq" is an existing Arabic word, so a branded search is not a search for
      an invented term with one possible answer — it competes with dictionary
      entries and names. This is what tells Google the string also identifies a
      piece of software, who publishes it, what it costs and what it runs on,
      which is what earns the block on the right rather than a blue link
      somewhere on page one.

      Every field here is checkable against the product. An inflated rating or
      an invented review count is the one thing that gets structured data
      ignored permanently, so there are none.
    -->
    <!--
      No softwareVersion in the block below. It read 0.1.67 for eight minor
      releases, because it was the one version string release.sh never rewrote.
      It is not a ranking or rich-result factor, so a field that is only ever
      true by accident is worse than no field at all.

      Nothing but JSON may go inside the script tag. An HTML comment in there
      is a parse error, and a parse error voids the whole block silently.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sidq",
        "url": "https://www.sidq.tech/",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "macOS",
        "description": "Sidq keeps a memory of each thing you are working on, assembled from your own words across every AI on your Mac, and gives it to whichever assistant you open. It also carries any single conversation into any other AI, word for word. Nothing is uploaded.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "author": {
          "@type": "Person",
          "name": "Nils Lilja"
        },
        "publisher": {
          "@type": "Organization",
          "name": "Sidq",
          "url": "https://www.sidq.tech/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
