<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sidq. Stop explaining yourself to every AI.</title>
    <meta
      name="description"
      content="You explain your project to one model, then the next, and a second opinion is only ever an opinion on your summary. Sidq moves the whole conversation across, word for word, from the files already on your Mac."
    />
    <meta name="theme-color" content="#F7F6F3" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- No manifest, deliberately: Sidq ships as a signed .dmg, not an installable site. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family plus its mono. Weights limited to what the design actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      What LinkedIn, Slack and iMessage show when the link is pasted. This is the
      first thing most people will ever see of Sidq, so it says what the product
      is rather than a slogan.
    -->
    <meta property="og:title" content="Sidq. Stop explaining yourself to every AI." />
    <meta
      property="og:description"
      content="You explain your project to one model, then the next, and a second opinion is only ever an opinion on your summary. Sidq moves the whole conversation across, word for word, from the files already on your Mac."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sidq" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
