<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sidq. The models remember everything except you.</title>
    <meta
      name="description"
      content="Stop introducing yourself to robots. Sidq is the memory layer for every AI you use: every conversation you have ever had, together on your Mac, and any of them carried whole into any other. Word for word, never a summary."
    />
    <meta name="theme-color" content="#F7F6F3" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <!-- No manifest, deliberately: Sidq ships as a signed .dmg, not an installable site. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- One family plus its mono. Weights limited to what the design actually uses. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!--
      What LinkedIn, Slack and iMessage show when the link is pasted. This is the
      first thing most people will ever see of Sidq.

      The card takes the pitch rather than the headline, and that is deliberate.
      A headline is read on a page that is already explaining itself; a card is
      read alone, in a feed, next to somebody else's message. The line that gets
      repeated goes where repetition happens. The description underneath does
      the explaining the card cannot.
    -->
    <meta property="og:title" content="Stop introducing yourself to robots." />
    <meta
      property="og:description"
      content="Sidq is the memory layer for every AI you use. Every conversation you have ever had, together on your Mac, and any one of them carried whole into any other. Word for word, never a summary."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sidq" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
